<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Wegscheid Reservierungssystem V1.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase / Cloud Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <style>
        .vertical-text {
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            text-align: center;
            white-space: nowrap;
        }
        html, body { min-height: 100%; }
        body { overflow-x: hidden !important; overflow-y: auto !important; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-xs text-gray-100 min-h-screen flex flex-col">

    <header class="bg-zinc-900 border-b border-red-800 text-white shadow-sm shrink-0">
        <div class="container mx-auto px-3 py-1.5 grid grid-cols-3 items-center">
            <div class="flex items-center gap-2">
                <span class="bg-red-700 text-white px-1.5 py-0.5 rounded text-[10px]">ECW</span>
            </div>
            <h1 class="text-sm font-bold tracking-wide text-center">
                EC Wegscheid Reservierungssystem
            </h1>
            <div class="flex items-center justify-end space-x-3">
                <span id="userStatusBadge" class="bg-zinc-800 border border-zinc-700 text-zinc-200 px-2 py-0.5 rounded text-xs">Angemeldet: Fesl Thomas</span>
                <span id="firebaseStatusBadge" class="px-2 py-0.5 rounded text-[10px] border bg-zinc-800 text-zinc-400 border-zinc-700">Firebase wird geprüft...</span>
                <button type="button" onclick="openLoginModal()" class="bg-red-700 hover:bg-red-800 text-white px-2.5 py-1 rounded font-semibold transition cursor-pointer text-xs">Login / Admin</button>
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 shrink-0">
        <div class="container mx-auto px-3 flex justify-between items-center text-xs py-1">
            <div class="flex space-x-2 items-center">
                <button type="button" onclick="switchTab('booking')" id="navBooking" class="py-1 border-b-2 border-red-600 font-semibold text-white cursor-pointer">📅 Reservierung</button>
                <button type="button" onclick="switchTab('members')" id="navMembers" class="py-1 border-b-2 border-transparent text-zinc-400 hover:text-white cursor-pointer">👥 Mitglieder (<span id="memberCount">0</span>)</button>
                <button type="button" onclick="switchTab('admin')" id="navAdmin" class="py-1 border-b-2 border-transparent text-zinc-400 hover:text-white hidden cursor-pointer">⚙️ Admin</button>
            </div>
            <div class="flex items-center space-x-2 bg-zinc-800/90 px-2.5 py-1 rounded border border-zinc-700 shadow-sm">
                <button type="button" onclick="shiftWeek(-1)" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white px-1.5 py-0.5 rounded font-bold cursor-pointer" title="Vorherige Woche">◀</button>
                <input type="date" id="calendarDate" onchange="renderSavedBookings()" class="hidden">
                <span id="kwDisplayBadge" class="font-bold text-red-400 px-1 text-xs">KW --</span>
                <button type="button" onclick="shiftWeek(1)" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white px-1.5 py-0.5 rounded font-bold cursor-pointer" title="Nächste Woche">▶</button>
                <button type="button" onclick="setWeekToToday()" class="bg-zinc-700 hover:bg-zinc-600 border border-zinc-600 text-zinc-200 px-2 py-0.5 rounded font-semibold cursor-pointer">Heute</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[99%] mx-auto px-1 py-1 space-y-1 flex-grow flex flex-col w-full">
        
        <div id="tabBooking" class="space-y-1 flex flex-col flex-grow">
            <div class="bg-zinc-800 p-2 rounded border border-zinc-700 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-2">
                    <button type="button" onclick="openBookingModal('Bahn 1')" class="bg-red-700 hover:bg-red-800 text-white px-3 py-1 rounded font-semibold cursor-pointer text-xs">+ Bahn buchen</button>
                    <button type="button" onclick="openClubhouseModal()" class="bg-blue-700 hover:bg-blue-800 text-white px-3 py-1 rounded font-semibold cursor-pointer text-xs">🏠 Vereinsheim</button>
                </div>
                <div class="grid grid-cols-2 gap-1 bg-zinc-900 p-0.5 rounded font-semibold text-center border border-zinc-700">
                    <button type="button" onclick="changeView('day')" id="btnDay" class="px-3 py-0.5 text-zinc-300 rounded hover:bg-zinc-700 cursor-pointer text-xs">Tag (Zukunft)</button>
                    <button type="button" onclick="changeView('week')" id="btnWeek" class="px-3 py-0.5 bg-red-700 text-white rounded cursor-pointer text-xs">Woche (Matrix)</button>
                </div>
            </div>
            <div class="bg-zinc-800 p-2 rounded border border-zinc-700 flex flex-col flex-grow overflow-hidden">
                <div id="savedBookingsContainer" class="space-y-2 overflow-y-auto flex-grow pr-1"></div>
            </div>
        </div>

        <div id="tabMembers" class="space-y-2 hidden overflow-y-auto flex-grow">
            <div class="bg-zinc-800 p-3 rounded border border-zinc-700 space-y-2">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <h3 class="text-xs font-bold text-zinc-200">Mitgliederverzeichnis & Passwort-Änderung</h3>
                    <div id="membersAdminSaveSection" class="hidden">
                        <button type="button" onclick="openSavePromptModal()" class="bg-red-700 hover:bg-red-800 text-white px-3 py-1 rounded font-bold text-xs shadow cursor-pointer">💾 Änderungen speichern</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-zinc-900 border-b border-zinc-700 text-zinc-400 text-[11px]">
                                <th class="p-1.5">Name</th>
                                <th class="p-1.5">Passwort</th>
                                <th class="p-1.5">Status</th>
                                <th class="p-1.5">Sonderrechte</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody" class="divide-y divide-zinc-700 text-zinc-300"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tabAdmin" class="space-y-2 hidden overflow-y-auto flex-grow">
            <div class="bg-zinc-800 p-3 rounded border border-zinc-700 border-l-4 border-l-red-600 space-y-2.5">
                <h3 class="text-xs font-bold text-zinc-200">⚙️ Admin-Bereich</h3>
                <button type="button" onclick="printStatistics()" class="bg-zinc-700 hover:bg-zinc-600 text-white px-2.5 py-1 rounded font-semibold text-xs">🖨️ Statistik Ausdrucken</button>
            </div>
        </div>

    </main>

    <!-- Modals -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center z-50 p-2">
        <div class="bg-zinc-800 p-3 rounded-lg shadow-lg w-72 space-y-2.5 border border-zinc-700">
            <h3 class="text-xs font-bold text-zinc-100">Anmeldung</h3>
            <select id="loginUserSelect" class="w-full border border-zinc-700 rounded p-1 bg-zinc-900 text-white">
                <option value="admin">⚙️ Administrator</option>
            </select>
            <input type="password" id="loginPasswordInput" placeholder="Passwort" class="w-full border border-zinc-700 rounded p-1 bg-zinc-900 text-white">
            <div class="flex space-x-2">
                <button type="button" onclick="verifyLogin()" class="w-full bg-red-700 text-white py-1.5 rounded">Einloggen</button>
                <button type="button" onclick="closeLoginModal()" class="w-full bg-zinc-700 text-white py-1.5 rounded">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let currentUser = { role: 'member', name: 'Fesl Thomas' };
        let adminPassword = '081500';
        let membersList = [
            { name: "Fesl Thomas", pass: "1234", active: true, hidden: false, specialRights: false },
            { name: "Allmannsberger Adi", pass: "1234", active: true, hidden: false, specialRights: false }
        ];
        let bookingsList = [];
        let bookingHistory = [];
        let currentView = 'week';

        function switchTab(tabId) {
            document.getElementById('tabBooking').classList.add('hidden');
            document.getElementById('tabMembers').classList.add('hidden');
            document.getElementById('tabAdmin').classList.add('hidden');
            
            document.getElementById('navBooking').className = "py-1 border-b-2 border-transparent text-zinc-400 cursor-pointer";
            document.getElementById('navMembers').className = "py-1 border-b-2 border-transparent text-zinc-400 cursor-pointer";
            document.getElementById('navAdmin').className = "py-1 border-b-2 border-transparent text-zinc-400 cursor-pointer";

            if(tabId === 'booking') {
                document.getElementById('tabBooking').classList.remove('hidden');
                document.getElementById('navBooking').className = "py-1 border-b-2 border-red-600 font-semibold text-white cursor-pointer";
            } else if(tabId === 'members') {
                document.getElementById('tabMembers').classList.remove('hidden');
                document.getElementById('navMembers').className = "py-1 border-b-2 border-red-600 font-semibold text-white cursor-pointer";
                renderMembersTable();
            } else if(tabId === 'admin') {
                document.getElementById('tabAdmin').classList.remove('hidden');
                document.getElementById('navAdmin').className = "py-1 border-b-2 border-red-600 font-semibold text-white cursor-pointer";
            }
        }

        function renderMembersTable() {
            const tbody = document.getElementById('membersTableBody');
            if(!tbody) return;
            tbody.innerHTML = '';
            membersList.forEach(m => {
                tbody.innerHTML += `<tr>
                    <td class="p-1.5">${m.name}</td>
                    <td class="p-1.5">••••</td>
                    <td class="p-1.5">${m.active ? 'Aktiv' : 'Inaktiv'}</td>
                    <td class="p-1.5">${m.specialRights ? 'Ja' : 'Nein'}</td>
                </tr>`;
            });
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function verifyLogin() {
            alert("Login-Test erfolgreich!");
            closeLoginModal();
        }

        function getTodayFormatted() {
            let d = new Date();
            return d.toISOString().split('T')[0];
        }

        function getMonday(dateStr) {
            let d = new Date(dateStr);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff)).toISOString().split('T')[0];
        }

        function renderSavedBookings() {
            const container = document.getElementById('savedBookingsContainer');
            if(container) container.innerHTML = '<p class="text-zinc-400 p-2">Keine Buchungen vorhanden.</p>';
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('calendarDate').value = getMonday(getTodayFormatted());
            renderSavedBookings();
            renderMembersTable();
        });
    </script>
</body>
</html>
